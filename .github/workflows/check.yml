name: Check family deployment
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-account-test.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test controller navigation in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/check_gamepad.cjs
          node scripts/check_game_audio.cjs
          BROWSER_CHANNEL=chromium node scripts/check_cabinet.cjs
          BROWSER_CHANNEL=chromium node scripts/check_presentation.cjs
          python scripts/sync_test_server.py &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18896/health; then break; fi
            sleep 1
          done
          BROWSER_CHANNEL=chromium node scripts/check_account_sync.cjs
      - name: Build clean Docker image
        run: docker compose build
      - name: Test empty-library container as non-root
        run: |
          mkdir -p roms
          chmod 755 roms
          docker compose up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18888/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18888/library/
          curl --fail --silent http://127.0.0.1:18888/library/catalog.json | python -c 'import json,sys; assert json.load(sys.stdin)["games"] == []'
          curl --fail --silent http://127.0.0.1:18888/library/game-layouts.json | python -c 'import json,sys; data=json.load(sys.stdin); assert data["mame2003_plus"]["1942"] == 0.75; assert data["fbneo"]["darius"] == 4'
          curl --fail --silent http://127.0.0.1:18888/library/sounds.js > /dev/null
          curl --fail --silent http://127.0.0.1:18888/library/presentation.js > /dev/null
          DEMO_URL=http://127.0.0.1:18888 BROWSER_CHANNEL=chromium node scripts/check_sounds.cjs
          DEMO_URL=http://127.0.0.1:18888 BROWSER_CHANNEL=chromium node scripts/check_core_cache.cjs
          DEMO_URL=http://127.0.0.1:18888 BROWSER_CHANNEL=chromium node scripts/check_shader_preview.cjs
          docker compose exec -T arcade id
          docker compose logs --tail=30
      - if: always()
        run: docker compose down
