<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="20" fill="#151612"/><g fill="#f3f3e9" font-family="Microsoft YaHei, sans-serif"><text x="65" y="85" font-size="38" font-weight="700">部署前，确认这些文件在同一个目录。</text><text x="65" y="135" font-size="20" fill="#a2ad93">下载仓库 ZIP → 解压到飞牛 → Docker / Compose 创建项目</text><g font-family="Consolas, monospace" font-size="24" fill="#d0ef88"><text x="75" y="205">pixel-arcade-family/</text><text x="110" y="255">compose.yaml</text><text x="110" y="295">Dockerfile</text><text x="110" y="335">server.py + catalog.py</text><text x="110" y="375">engine-lock.json</text><text x="110" y="415">scripts/ + site/</text><text x="110" y="455">roms/</text></g><text x="680" y="255" font-size="24">端口：18888</text><text x="680" y="310" font-size="24">ROM：只读挂载</text><text x="680" y="365" font-size="24">账号：无需登录</text><text x="680" y="420" font-size="24">构建后：资源本地提供</text><text x="65" y="555" font-size="20" fill="#a2ad93">完整源码参与构建，请保留目录结构。游戏资源自行导入。</text></g></svg>
